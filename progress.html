
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress | Habitly</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">🌱 Habitly</a>

            <nav class="navigation" aria-label="Main navigation">
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="habits.html" class="nav-link">My Habits</a>
                <a href="progress.html" class="nav-link active">Progress</a>
                <a href="about.html" class="nav-link">About</a>
            </nav>

            <span class="header-date">Your Achievements</span>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <section class="welcome-section">
                <div>
                    <p class="welcome-label">KEEP GROWING</p>
                    <h1>Your Progress</h1>
                    <p class="welcome-description">
                        Consistency is the key to long-term success.
                    </p>
                </div>
            </section>

            <section class="stats-section">
                <h2>Your Weekly Overview</h2>

                <div class="stats-grid">
                    <article class="stat-card">
                        <div class="stat-icon">🔥</div>
                        <p class="stat-title">Best Streak</p>
                        <h3>12 Days</h3>
                    </article>

                    <article class="stat-card">
                        <div class="stat-icon">📈</div>
                        <p class="stat-title">Completion</p>
                        <h3>78%</h3>
                    </article>

                    <article class="stat-card">
                        <div class="stat-icon">🏆</div>
                        <p class="stat-title">Completed Today</p>
                        <h3>3/5</h3>
                    </article>
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-container">
            <p>Built with the CodGen Frontend Internship | <a href="https://codgen.in">codgen.in</a></p>
        </div>
    </footer>

</body>
</html>
